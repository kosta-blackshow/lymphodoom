<style>
@font-face { font-family: "Helvetica Neue Site"; src: url("/fonts/HelveticaNeue-Roman.otf") format("opentype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Helvetica Neue Site"; src: url("/fonts/HelveticaNeue-Medium.otf") format("opentype"); font-weight: 500; font-display: swap; }
:root {
  --navy: #1d2b53;     /* bible NAVY: the tissue background */
  --grid: #26386a;
  --deep: #141e3c;
  --rim: #00e436;      /* killer T rim */
  --logo: #ffec27;     /* logo yellow */
  --peach: #ffccaa;
  --white: #fff1e8;
  --lav: #83769c;
  --plum: #7e2553;
}
* { box-sizing: border-box; }
html { background: var(--navy); }
body {
  margin: 0;
  color: var(--white);
  font-family: "Helvetica Neue Site", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  background-color: var(--navy);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 100vh;
}
a { color: var(--peach); text-underline-offset: 3px; }
a:hover { color: var(--white); }
:focus-visible { outline: 3px solid var(--logo); outline-offset: 3px; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 56px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 18px; font-size: 15px; }
.top a { color: var(--lav); }
.top a:hover { color: var(--white); }

/* the game screen is the hero: poster first, then the running game in the same frame */
.screen {
  position: relative;
  aspect-ratio: 16 / 10;
  width: 100%;
  background: #000;
  border: 6px solid #000;
  box-shadow: 0 0 0 3px var(--rim), 10px 10px 0 3px var(--plum);
  overflow: hidden;
}
.screen img, .screen canvas {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.screen canvas { display: none; object-fit: contain; background: #000; outline: none; }
.screen.running img, .screen.running .start { display: none; }
.screen.running canvas { display: block; }
.start {
  position: absolute; left: 50%; top: 23%; transform: translateX(-50%);
  width: 47%;
  display: flex; flex-direction: column; align-items: center; gap: 4%;
}
button.skill {
  display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
  box-shadow: 6px 6px 0 0 #000;
}
button.skill img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
button.skill:hover img, button.skill:focus-visible img { filter: brightness(1.25); }
button.skill:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 0 #000; }
button.skill[disabled] { opacity: .5; cursor: progress; }
.status { min-height: 1.5em; font-size: 15px; color: var(--white); text-shadow: 2px 2px 0 #000; }
.bar { width: 220px; height: 8px; background: #000; border: 2px solid #000; display: none; }
.bar i { display: block; height: 100%; width: 0; background: var(--logo); }
.loading .bar { display: block; }
.loading button.skill { display: none; }
.mobile { display: none; margin-top: 18px; padding: 12px 16px; background: #000; box-shadow: 0 0 0 3px var(--plum); }
.mobile p { margin: 0 0 6px; }
.touch .mobile { display: block; }
.touch button.skill, .touch .tools { display: none; }

.tools { display: flex; justify-content: flex-end; gap: 18px; margin-top: 14px; font-size: 15px; }
.tools button { font: inherit; color: var(--peach); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.howto { display: block; width: 100%; height: auto; margin-top: 36px; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 0 3px #000; }
p { margin: 0 0 14px; max-width: 34em; }
.fine { margin-top: 28px; font-size: 13px; color: var(--lav); max-width: none; }
.fine a { color: var(--lav); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<div class="wrap">
  <nav class="top">
    <a href="/">Константин Чернышов</a>
    <a href="https://kostachernyshov.com/lymphodoom/" hreflang="en" lang="en">In English</a>
  </nav>

  <div class="screen" id="screen">
    <img src="start.png" width="320" height="200" alt="LYMPHODOOM. Управление: W A S D — движение, мышь — прицел и огонь, E или правая кнопка — открыть, 1–7 — оружие, Tab — карта.">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="start" id="start">
      <button class="skill" type="button" data-skill="2"><img src="btn_easy.png" width="150" height="26" alt="Играть: Common cold (легко)"></button>
      <button class="skill" type="button" data-skill="4"><img src="btn_hard.png" width="150" height="26" alt="Играть: Metastasis (сложно)"></button>
      <div class="bar"><i id="bar"></i></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="mobile" id="mobile"><p>Для LYMPHODOOM нужны клавиатура и мышь. Откройте страницу на компьютере.</p><a href="#" id="anyway">Всё равно запустить</a></div>
  <div class="tools">
    <button type="button" id="fullscreen">На весь экран</button>
  </div>

  <img class="howto" src="howto.png" width="320" height="168" alt="Вы — Т-киллер. Стреляйте в вирусы, бактерии, опухолевые клетки, паразитов, фагов, споры и босса. Глюкоза лечит, мембрана защищает, ещё есть патроны и дендритная клетка с картой; MHC-I-ключи открывают ворота. Три уровня: лимфоузел, кровоток, опухоль.">

  <p class="fine">Движок: <a href="https://github.com/GMH-Code/Dwasm">Dwasm</a> (PrBoomX / PrBoom+), GNU GPL v2. Инструменты музыки: Freedoom (BSD). Игра не связана с id Software и ZeniMax. <a href="https://github.com/kosta-blackshow/lymphodoom">Исходный код</a>.</p>
</div>

<script>
(function () {
  var screen = document.getElementById('screen');
  var canvas = document.getElementById('canvas');
  var skills = document.querySelectorAll('button.skill');
  var statusEl = document.getElementById('status');
  var bar = document.getElementById('bar');
  var start = document.getElementById('start');
  var T = {"loading": "Загрузка…", "preparing": "Запускаю движок…", "failed": "Файлы игры не загрузились. Проверьте соединение и выберите сложность ещё раз.", "crashed": "Движок остановился. Обновите страницу, чтобы играть снова."};

  var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
  if (coarse) document.body.classList.add('touch');
  document.getElementById('anyway').addEventListener('click', function (e) {
    e.preventDefault(); document.body.classList.remove('touch');
  });

  function setStatus(text) {
    var m = text && text.match(/\(([\d.]+)\/(\d+)\)/);
    if (m) {
      bar.style.width = Math.min(100, 100 * parseFloat(m[1]) / parseFloat(m[2])) + '%';
      statusEl.textContent = T.loading;
    } else if (text) {
      statusEl.textContent = T.preparing;
    }
  }

  function lockPointer() {
    if (document.pointerLockElement !== canvas && canvas.requestPointerLock) {
      try { canvas.requestPointerLock(); } catch (e) {}
    }
  }

  var started = false;
  function launch(skill) {
    if (started) return;
    started = true;
    skills.forEach(function (b) { b.disabled = true; });
    start.classList.add('loading');
    statusEl.textContent = T.loading;
    window.Module = {
      canvas: canvas,
      arguments: ['-iwad', 'lymphodoom.wad', '-skill', String(skill || 2), '-warp', '1', '1'],
      locateFile: function (path) { return 'game/' + path; },
      print: function () { console.log(Array.prototype.join.call(arguments, ' ')); },
      printErr: function () { console.warn(Array.prototype.join.call(arguments, ' ')); },
      setStatus: setStatus,
      monitorRunDependencies: function () {},
      hideConsole: function () {
        screen.classList.add('running');
        canvas.focus();
      },
      showConsole: function () {
        screen.classList.remove('running');
        statusEl.textContent = T.crashed;
      },
      captureMouse: lockPointer,
      winResized: function () {},
      softExit: function () { location.reload(); }
    };
    var s = document.createElement('script');
    s.src = 'game/index.js';
    s.async = true;
    s.onerror = function () { statusEl.textContent = T.failed; skills.forEach(function (b) { b.disabled = false; }); started = false; start.classList.remove('loading'); };
    document.body.appendChild(s);
  }

  skills.forEach(function (b) {
    b.addEventListener('click', function () { launch(b.getAttribute('data-skill')); });
  });
  canvas.addEventListener('mousedown', lockPointer);
  document.getElementById('fullscreen').addEventListener('click', function () {
    var el = screen;
    (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
    if (!started) launch(2);
  });
  document.addEventListener('fullscreenchange', function () {
    screen.style.border = document.fullscreenElement ? '0' : '';
  });
})();
</script>
